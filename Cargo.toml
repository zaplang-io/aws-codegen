[package]
name = "aws-codegen"
version = "0.1.0"
edition = "2021"
description = "Model-driven generator: botocore service-2.json -> Zap AWS SDK clients (awsJson v0)"
license = "Apache-2.0"
repository = "https://github.com/zaplang-io/aws-codegen"

[[bin]]
name = "aws-codegen"
path = "src/main.rs"

[lib]
name = "aws_codegen"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
indexmap = { version = "2.7.1", features = ["serde"] }

[dev-dependencies]
# An independent, host-only SigV4 signer for the DescribeTable byte-diff test
# (tests/byte_diff.rs). Pure-Rust, no system libraries — safe in the `cargo test`
# gate with no Zap toolchain. Mirrors aws.core's algorithm so the reconstructed
# request matches the hand-written reference's pinned bytes.
sha2 = "0.10.8"
hmac = "0.12.1"

[profile.release]
opt-level = 2
