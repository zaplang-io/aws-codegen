name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # Single required aggregate status check for branch protection: "CI gate".
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (-D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --locked

      - name: test
        # Includes the byte-diff gates: tests/byte_diff.rs (DynamoDB awsJson
        # DescribeTable) and tests/rest_byte_diff.rs (Lambda rest-json GetFunction
        # / ListFunctions / Invoke / PutFunctionConcurrency) — each request,
        # reconstructed from the generated source + an independent SigV4/binding
        # signer, must be byte-identical to the pinned golden. Toolchain-free.
        run: cargo test --locked

      - name: generated output is current (determinism)
        # The generator is the source of truth: every checked-in client must
        # regenerate byte-identically from its pinned model (+ paginators sidecar).
        # Driven by models/manifest.json (#364 broad rollout) via
        # tools/manifest_services.py, so this covers every manifested service with
        # no hand-maintained list. `cargo test` also checks this (the data-driven
        # `all_checked_in_packages_are_current` test); this step keeps the check in
        # the exact CLI shape users run (`aws-codegen <model> --package ... --name`).
        run: |
          set -eu
          cargo build --locked
          bin="$(pwd)/target/debug/aws-codegen"
          fail=0
          while IFS="$(printf '\t')" read -r svc ver pkg; do
            model="models/$svc/$ver/service-2.json"
            out="$(mktemp -d)"
            "$bin" "$model" --package "$out" --name "$pkg"
            for rel in zap.toml "src/$pkg.zap"; do
              if ! diff -u "generated/$pkg/$rel" "$out/$rel"; then
                echo "::error::generated/$pkg/$rel is stale — regenerate it (make generate)" >&2
                fail=1
              fi
            done
            rm -rf "$out"
          done < <(python3 tools/manifest_services.py)
          exit "$fail"

      - name: byte-diff goldens are correct SigV4 (independent oracles)
        # Toolchain-free second implementations of the on-the-wire request bytes;
        # prove each golden is genuine SigV4 even on a runner with no Zap
        # toolchain. Blocking. DynamoDB (#348) + the #350 JSON services (SQS 1.0,
        # Kinesis 1.1) + the Lambda rest-json fixtures (#4: GetFunction /
        # ListFunctions / Invoke / PutFunctionConcurrency, cross-checked vs botocore)
        # + the #354 XML-family fixtures (CloudFront rest-xml, SimpleDB query,
        # EC2 ec2, + a synthetic rest-xml flattened-list/attribute/prefixed-ns case).
        run: |
          python3 tools/verify_describe_table.py
          python3 tools/verify_goldens.py
          python3 tools/verify_lambda_requests.py
          python3 tools/verify_xml_requests.py

      # Best-effort: compile the generated Zap under the published compiler image.
      # Non-blocking because the published image lags the derive(Json) AWS hooks
      # (zaplang-io/zap#346); it turns green once those land upstream.
      - name: compile generated Zap (best-effort)
        continue-on-error: true
        run: |
          docker pull ghcr.io/zaplang-io/zap:latest
          bash scripts/compile_check.sh dynamodb vendor/smoke_main.zap
          bash scripts/compile_check.sh sqs vendor/smoke_sqs_main.zap
          bash scripts/compile_check.sh kinesis vendor/smoke_kinesis_main.zap

      # Best-effort: the end-to-end byte-diff — run the GENERATED client under the
      # real toolchain and diff its serialized DescribeTable request against the
      # golden. Non-blocking for the same reason as the compile step (needs
      # zaplang-io/zap#346 in the image); the blocking halves of the #348 gate are
      # the `test` step (tests/byte_diff.rs) and the independent-oracle step above.
      - name: byte-diff generated DescribeTable under toolchain (best-effort)
        continue-on-error: true
        run: |
          docker pull ghcr.io/zaplang-io/zap:latest
          bash scripts/byte_diff_check.sh
